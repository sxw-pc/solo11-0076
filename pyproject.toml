[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topoaudit"
version = "1.0.0"
description = "Deterministic, offline geometry and topology audit workbench for local vector data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
topoaudit = "topoaudit.cli:main"

[tool.setuptools]
packages = ["topoaudit"]
